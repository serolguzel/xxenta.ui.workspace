<div class="w-full flex flex-col">
    <div
        class="flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between p-4 sm:px-10 border-b bg-card dark:bg-transparent">
        <!-- Actions -->
        <div class="flex shrink-0 items-center">
            <genesis-breadcrumbs [Breadcrumbs]="breadcrumbs" class="flex"></genesis-breadcrumbs>
        </div>
    </div>

    <div class="flex-auto p-6 sm:p-10">
        <div class="w-full max-w-3xl">
            <div class="mb-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <p-select [options]="roles" [(ngModel)]="selectedRole" optionLabel="name" optionValue="id"
                    [placeholder]="'labels.select-role' | transloco" (onChange)="onRoleValueChanged($event)"
                    appendTo="body" styleClass="w-full sm:w-auto" />
                <p-iconfield iconPosition="left" class="w-full sm:w-auto">
                    <p-inputicon styleClass="pi pi-search" />
                    <input pInputText type="text" [ngModel]="filterText"
                        (ngModelChange)="onFilterChanged($event)"
                        [placeholder]="'labels.search' | transloco" class="w-full" style="width: 240px" />
                </p-iconfield>
            </div>

            <p-accordion [value]="data.length ? '0' : null" id="accordion-container">
                @for (item of data; track item.moduleName; let i = $index) {
                <p-accordion-panel [value]="i.toString()">
                    <p-accordion-header>
                        <span class="header font-medium">{{ item.moduleName }}</span>
                    </p-accordion-header>
                    <p-accordion-content>
                        @for (row of item.permissions; track row.claimValue) {
                        <div class="flex items-center justify-between py-2">
                            <div class="field-label">{{ row.claimValue }}</div>
                            <div class="field-value">
                                <p-toggleswitch [(ngModel)]="row.hasRole"
                                    (onChange)="onRowValueChanged($event, row)" />
                            </div>
                        </div>
                        }
                    </p-accordion-content>
                </p-accordion-panel>
                }
            </p-accordion>
        </div>
    </div>
</div>
