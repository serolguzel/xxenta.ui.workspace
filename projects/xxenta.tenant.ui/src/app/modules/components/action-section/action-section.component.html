<div class="bg-card">
  <div class="flex flex-col w-full max-w-screen-xl mx-auto px-6 sm:px-8">
    <div class="flex flex-col sm:flex-row flex-auto sm:items-center min-w-0 my-4 sm:my-8">
      <div class="flex items-center justify-end gap-2 w-full">
        <p-button [label]="btnTourTransferPlan.text" icon="pi pi-car" severity="secondary"
          (onClick)="transferPlanClick()" />
        <p-button [label]="btnReservation.text" icon="pi pi-ticket" severity="secondary"
          (onClick)="reservationClick()" />
        <p-button [label]="btnBooking.text" icon="pi pi-save" (onClick)="btnBooking.onClick()" />
      </div>
    </div>
  </div>
</div>
