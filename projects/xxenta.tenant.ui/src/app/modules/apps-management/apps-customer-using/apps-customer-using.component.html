<div class="p-6">
  <genesis-data-table
    [title]="'labels.application' | transloco"
    [lazy]="false"
    [loadPath]="loadPath"
    dataKey="organizationId"
    [pageSize]="20"
    [columns]="columns">

    <ng-template gdtCell="appId" let-row>
      {{ appNames[row.appId] ?? row.appId }}
    </ng-template>
  </genesis-data-table>
</div>
