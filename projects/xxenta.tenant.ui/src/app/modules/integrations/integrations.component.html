<div class="p-6">
  <genesis-data-table
    [title]="'labels.integrations' | transloco"
    [lazy]="false"
    [editable]="true"
    loadPath="Integration"
    insertPath="Integration"
    updatePath="Integration"
    deletePath="Integration"
    updateKey="id"
    [editorTitle]="'labels.integrations' | transloco"
    editorWidth="640px"
    [pageSize]="10"
    [pageSizeOptions]="[10, 20, 30]"
    [columns]="columns">

    <ng-template gdtCell="appIds" let-row>
      <span class="flex text-xs w-full" *ngIf="row.apps">
        <badge-taskstatus *ngFor="let f of row.apps" textSizeClass="mr-2" [text]="f.name"></badge-taskstatus>
      </span>
    </ng-template>

    <ng-template gdtCell="$editor" let-row>
      <div class="flex flex-col gap-4 pt-2">
        <div class="grid grid-cols-2 gap-4">
          <p-floatlabel>
            <input pInputText id="code" [(ngModel)]="row.code" [disabled]="!!row.id" class="w-full" />
            <label for="code">{{ 'labels.code' | transloco }}</label>
          </p-floatlabel>

          <p-floatlabel>
            <p-inputnumber inputId="price" [(ngModel)]="row.price" [min]="0" [showButtons]="true" class="w-full" />
            <label for="price">{{ 'labels.price' | transloco }}</label>
          </p-floatlabel>
        </div>

        <p-floatlabel>
          <input pInputText id="name" [(ngModel)]="row.name" class="w-full" />
          <label for="name">{{ 'labels.name' | transloco }}</label>
        </p-floatlabel>

        <p-floatlabel>
          <input pInputText id="description" [(ngModel)]="row.description" class="w-full" />
          <label for="description">{{ 'labels.description' | transloco }}</label>
        </p-floatlabel>

        <p-floatlabel>
          <input pInputText id="icon" [(ngModel)]="row.icon" class="w-full" />
          <label for="icon">{{ 'labels.icon' | transloco }}</label>
        </p-floatlabel>

        <p-floatlabel>
          <p-multiselect appendTo="body" inputId="appIds" [(ngModel)]="row.appIds" [options]="apps"
            optionLabel="name" optionValue="id" [filter]="true" [showClear]="true" class="w-full" />
          <label for="appIds">{{ 'labels.apps' | transloco }}</label>
        </p-floatlabel>
      </div>
    </ng-template>
  </genesis-data-table>
</div>
