<div class="p-6">
  <genesis-data-table
    [title]="'labels.client-permissions' | transloco"
    [lazy]="false"
    [editable]="true"
    [loadPath]="loadPath"
    [insertPath]="loadPath"
    [deletePath]="loadPath"
    updateKey="id"
    [editorTitle]="'labels.client-permission' | transloco"
    [pageSize]="10"
    [columns]="columns"
    [newRowDefaults]="{ type: 'permission' }">

    <ng-template gdtCell="$editor" let-row>
      <div class="flex flex-col gap-4 pt-2">
        <p-floatlabel>
          <input pInputText id="type" [(ngModel)]="row.type" [disabled]="true" class="w-full" />
          <label for="type">{{ 'labels.type' | transloco }}</label>
        </p-floatlabel>

        <p-floatlabel>
          <p-select appendTo="body" inputId="value" [(ngModel)]="row.value" [options]="claimsDataSource"
            optionLabel="code" optionValue="code" [filter]="true" filterBy="state,code" class="w-full" />
          <label for="value">{{ 'labels.claims' | transloco }}</label>
        </p-floatlabel>
      </div>
    </ng-template>
  </genesis-data-table>
</div>
