<div class="p-6">
  <genesis-data-table
    [title]="'labels.claims' | transloco"
    [lazy]="false"
    [editable]="true"
    loadPath="Claim"
    insertPath="Claim"
    updatePath="Claim"
    updateKey="code"
    [editorTitle]="'labels.claim' | transloco"
    [pageSize]="20"
    [columns]="columns"
    [newRowDefaults]="{ hasTenant: false }">

    <ng-template gdtCell="$editor" let-row>
      <div class="flex flex-col gap-4 pt-2">
        <p-floatlabel>
          <input pInputText id="code" [(ngModel)]="row.code" class="w-full" />
          <label for="code">{{ 'labels.code' | transloco }}</label>
        </p-floatlabel>

        <p-floatlabel>
          <input pInputText id="state" [(ngModel)]="row.state" class="w-full" />
          <label for="state">{{ 'labels.state' | transloco }}</label>
        </p-floatlabel>

        <p-floatlabel>
          <input pInputText id="description" [(ngModel)]="row.description" class="w-full" />
          <label for="description">{{ 'labels.description' | transloco }}</label>
        </p-floatlabel>

        <div class="flex align-items-center gap-2">
          <p-checkbox [(ngModel)]="row.hasTenant" [binary]="true" inputId="hasTenant" />
          <label for="hasTenant">{{ 'labels.has-tenant' | transloco }}</label>
        </div>
      </div>
    </ng-template>
  </genesis-data-table>
</div>
