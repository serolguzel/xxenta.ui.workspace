<div class="flex flex-col flex-auto min-w-0 pb-8">
    <!-- Main -->
    <div class="bg-card">
        <div class="flex flex-col w-full max-w-screen-xl mx-auto px-6 sm:px-8">
            <div class="flex flex-col sm:flex-row flex-auto sm:items-center min-w-0 my-4 sm:my-8">
                <h1 class="flex w-full text-xl">Welcome {{user.displayName}}</h1>
                <div class="flex items-center gap-2">
                    @if (showActionButtons) {
                    <p-button [label]="'labels.generate-subscription' | transloco" icon="pi pi-coffee"
                        severity="secondary" (onClick)="generateSubscription()" />
                    <p-button [label]="'labels.customer-push-to-accounting' | transloco" icon="pi pi-download"
                        severity="secondary" (onClick)="pushCustomersToAccounting()" />
                    <p-button [label]="'labels.push-to-accounting' | transloco" icon="pi pi-download"
                        severity="secondary" (onClick)="pushToAccounting()" />
                    }
                </div>
            </div>
        </div>
    </div>
    <div class="flex-auto border-t -mt-px pt-4 sm:pt-6">
        <div class="w-full max-w-screen-xl mx-auto">
            <div class="sm:px-2">
                <div class="grid xs:grid-cols-1 sm:grid-cols-6 gap-6 mb-6 ">
                    <div class="col-span-2 bg-card shadow rounded-2xl overflow-hidden p-6">
                        <div class="text-lg font-medium tracking-tight leading-6 truncate mb-4">{{
                            'labels.send-notification' | transloco }}</div>

                        <div class="flex flex-col flex-auto mt-6">
                            <form [formGroup]="form">
                                <p-floatlabel>
                                    <textarea pTextarea id="text" formControlName="text" rows="4"
                                        class="w-full"></textarea>
                                    <label for="text">{{ 'labels.notification-text' | transloco }}</label>
                                </p-floatlabel>
                                @if (form.get('text')?.invalid && form.get('text')?.touched) {
                                <small class="p-error">{{ 'messages.required' | transloco }}</small>
                                }
                            </form>
                            <div class="flex justify-content-end mt-4">
                                <p-button [label]="'labels.save' | transloco" icon="pi pi-save" (onClick)="send()" />
                            </div>
                        </div>
                    </div>
                    <div class="col-span-4 bg-card shadow rounded-2xl overflow-hidden p-6">
                        <div class="text-lg font-medium tracking-tight leading-6 truncate mb-4">{{
                            'labels.monthly-pp-cost.title' | transloco }}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
