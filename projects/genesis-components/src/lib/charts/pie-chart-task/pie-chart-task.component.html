<div id="pie-chart-container" class="relative" [ngClass]="{'h-[220px]': count == 0}">
  @if (count > 0) {
    <p-chart type="pie" [data]="chartData" [options]="chartOptions"></p-chart>
  }
  @if (count < 1 && !loadingVisible) {
    <div class="p-4 border-2 border-dashed border-gray-300 rounded-md">
      {{ 'labels.no-data' | transloco }}
    </div>
  }
  @if (loadingVisible) {
    <div class="absolute inset-0 flex items-center justify-center bg-black/40 rounded-md z-10">
      <p-progressspinner strokeWidth="4" [style]="{ width: '50px', height: '50px' }" />
    </div>
  }
</div>
