<div id="pie-chart-container" [ngClass]="{'h-[220px]': count == 0}">
  <apx-chart *ngIf="count > 0"
    [series]="chartOptions.series!"
    [chart]="chartOptions.chart!"
    [labels]="chartOptions.labels"
    [responsive]="chartOptions.responsive!"></apx-chart>
  <div *ngIf="count < 1 && !loadingVisible" class="p-4 border-2 border-dashed border-gray-300 rounded-md">
    {{'labels.no-data' | transloco}}
  </div>
</div>
<dx-load-panel #loadPanel 
    shadingColor="rgba(0,0,0,0.4)" 
    [position]="{ of: '#pie-chart-container' }"
    [(visible)]="loadingVisible" 
    [showIndicator]="true" 
    [showPane]="true" 
    [shading]="true" 
    [hideOnOutsideClick]="false">
</dx-load-panel>
