<div class="chatbox w-full flex flex-col p-4">
    <div *ngIf="transferNotes?.length === 0" class="p-4 border-2 border-dashed border-gray-300 rounded-md">
        {{ 'labels.not-found' | transloco }}
    </div>

    <ng-container *ngFor="let group of groupedNotes">
        <div class="voucher-header mt-4 mb-2 font-bold text-lg border-b border-gray-300 pb-1">
            <span>{{ "labels.voucher" | transloco }}:
                {{ group.voucher }}</span>
            <span *ngIf="group.operatorVoucher" class="ml-4 text-sm text-gray-500">
                ({{ "labels.operator" | transloco }}:
                {{ group.operatorVoucher }})
            </span>
        </div>

        <div class="messages flex flex-col gap-4 mb-4">
            <div *ngFor="let note of group.notes" [ngClass]="{
            'message flex items-start gap-2': true,
            'theirs': note.createUser?.id !== userId,
            'mine flex-row-reverse': note.createUser?.id === userId
          }">
                <div class="rounded-full w-10 h-10 bg-gray-200 flex items-center justify-center overflow-hidden">
                    <img *ngIf="note.createUser?.picture" [src]="note.createUser?.picture" alt="" class="w-full h-full" />
                    <mat-icon *ngIf="!note.createUser?.picture" svgIcon="heroicons_solid:user"></mat-icon>
                </div>

                <div class="flex flex-col grow" [ngClass]="{
              'items-start': note.createUser?.id !== userId,
              'items-end': note.createUser?.id === userId
            }">
                    <div class="p-3 rounded max-w-[70%]" [ngClass]="{
                'bg-blue-100 text-gray-800 rounded-bl-none': note.createUser?.id !== userId,
                'bg-green-100 text-gray-800 rounded-br-none': note.createUser?.id === userId
              }">
                        {{ note.note }}
                    </div>
                    <div class="text-xs text-gray-500 mt-1">
                        {{ note.createUser?.department?.name || '' }} • {{ note.createDate | date: 'HH:mm dd.MM.yyyy' }}
                    </div>
                </div>
            </div>
        </div>
    </ng-container>
</div>
