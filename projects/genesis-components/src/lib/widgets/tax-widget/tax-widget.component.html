<div class="flex flex-col flex-auto p-6 bg-card shadow rounded-2xl overflow-hidden">
    <div class="flex items-start justify-between">
        <div class="text-lg font-medium tracking-tight leading-6 truncate">
            {{title}}
        </div>
        <div class="ml-2 -mt-2 -mr-3">
            <!-- <button mat-icon-button [matMenuTriggerFor]="summaryMenu">
                <mat-icon class="icon-size-5" [svgIcon]="'heroicons_mini:ellipsis-vertical'"></mat-icon>
            </button>
            <mat-menu #summaryMenu="matMenu">
                <button mat-menu-item>Yesterday</button>
                <button mat-menu-item>2 days ago</button>
                <button mat-menu-item>3 days ago</button>
            </mat-menu> -->
        </div>
    </div>
    <div class="flex flex-col items-center mt-2">
        <div class="text-4xl font-bold tracking-tight leading-none" [ngClass]="fontColorCss">
            {{data?.amount?.amount}}
        </div>
        <div class="text-lg font-medium" [ngClass]="fontColorCss">{{data?.amount?.currency}}</div>
        <div class="flex items-baseline justify-center w-full mt-5 text-secondary">
            <div class="text-md font-medium truncate">{{dateRangeLabel}}:</div>
            <div class="ml-1.5 text-md font-semibold">{{data?.beginDate | date: 'dd.MM.yyyy'}} - {{data?.endDate | date: 'dd.MM.yyyy'}}</div>
        </div>
    </div>
</div>
