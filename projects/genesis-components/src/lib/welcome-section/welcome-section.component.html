<div class="bg-card">
  <div class="flex flex-col w-full max-w-screen-xl mx-auto px-6 sm:px-8">
      <div class="flex flex-col sm:flex-row flex-auto sm:items-center min-w-0 my-8 sm:my-12">
          <!-- Avatar and name -->
          <div class="flex flex-auto items-center min-w-0">
              <div class="flex-0 w-16 h-16 rounded-full overflow-hidden">
                  <img class="w-full h-full object-cover" [src]="user.picture">
              </div>
              <div class="flex flex-col min-w-0 ml-4">
                <div class="text-2xl md:text-3xl font-semibold tracking-tight leading-7 md:leading-snug truncate">
                  {{user.displayName}}
                </div>
                  <div class="flex items-center">
                      <mat-icon
                          class="icon-size-5"
                          [svgIcon]="'heroicons_solid:bell'"></mat-icon>
                      <div class="ml-1.5 leading-6 truncate text-secondary">
                        Welcome!
                      </div>
                  </div>
              </div>
          </div>
          <!-- Actions -->
          <div class="flex items-center mt-6 sm:mt-0 sm:ml-2 space-x-3">
            <ng-content></ng-content>
              <button *ngIf="options.actions != null && options.actions.length > 0"
                  mat-flat-button [matMenuTriggerFor]="actionsMenu" [color]="'primary'">
                  <mat-icon class="icon-size-5" [svgIcon]="'heroicons_outline:plus-circle'"></mat-icon>
                  <span class="ml-2">Actions</span>
              </button>
              <mat-menu #actionsMenu="matMenu">
                <button mat-menu-item *ngFor="let action of options.actions" [routerLink]="action.link">
                  <mat-icon [svgIcon]="action.icon!"></mat-icon>
                  <span>{{action.label}}</span>
                </button>
            </mat-menu>
          </div>
      </div>
  </div>
</div>
