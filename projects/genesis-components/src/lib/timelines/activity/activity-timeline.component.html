<div class="w-full">
    <div class="mb-2 block text-base font-medium leading-6 text-gray-900" *ngIf="showTitle">
        {{'labels.activities' | transloco}}
    </div>
    <ol>
        <ng-container *ngFor="let row of data; let last = last;">
            <li class="relative group py-2">
                <div class="absolute top-6 left-4 w-0.5 h-full -ml-px bg-gray-300 dark:bg-gray-600" *ngIf="!last"></div>
                <div class="relative flex">
                    <div class="flex flex-0 items-center justify-center w-8 h-8 rounded-full ring-2 ring-inset bg-card dark:bg-default bg-primary dark:bg-primary text-on-primary ring-transparent ring-primary">
                        <img class="h-8 w-8 rounded-full" *ngIf="!row.user?.picture" src="assets/avatars/profile.jpg" alt="">
                        <img class="h-8 w-8 rounded-full" *ngIf="row.user?.picture" [src]="row.user?.picture" alt="">
                    </div>
                    <div class="ml-4">
                        <div class="font-medium leading-4">
                            {{row.user?.displayName}}
                            <span class="font-normal text-sm text-secondary">
                                <ng-container *ngIf="row.actionType === ActionType.Create">
                                    <span class="text-green-700 bg-green-50 ring-green-700/10">
                                        {{'labels.created' | transloco}}
                                    </span>
                                </ng-container>
                                <ng-container *ngIf="row.actionType === ActionType.Update">
                                    <span class="text-blue-700 bg-blue-50 ring-blue-700/10">
                                        {{'labels.updated' | transloco}}
                                    </span>
                                </ng-container>
                                <ng-container *ngIf="row.actionType === ActionType.Delete">
                                    <span class="text-red-700 bg-red-50 ring-red-700/10">
                                        {{'labels.deleted' | transloco}}
                                    </span>
                                </ng-container>.
                                at {{ row.changeDate | date: 'dd.MM.yyyy HH:mm'}}
                            </span>
                        </div>
                        <div class="text-xs">
                            {{row.description}}
                        </div>
                    </div>
                </div>
            </li>
        </ng-container>
        <div *ngIf="data.length < 1" class="p-4 border-2 border-dashed border-gray-300 rounded-md">
            {{'labels.no-data' | transloco}}
        </div>
    </ol>
</div>
