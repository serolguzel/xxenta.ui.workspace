<div class="p-6">
  <genesis-data-table
    [title]="pageTitle"
    [lazy]="false"
    [editable]="true"
    [loadPath]="loadPath"
    [insertPath]="loadPath"
    updatePath="OrganizationMapping"
    deletePath="OrganizationMapping"
    updateKey="id"
    [editorTitle]="'labels.mapping' | transloco"
    [pageSize]="20"
    [columns]="columns">

    <ng-template gdtCell="$editor" let-row>
      <div class="flex flex-col gap-4 pt-2">
        <p-floatlabel>
          <input pInputText id="oprVoucher" [(ngModel)]="row.oprVoucher" class="w-full" />
          <label for="oprVoucher">{{ 'labels.opr-voucher' | transloco }}</label>
        </p-floatlabel>

        <p-floatlabel>
          <input pInputText id="externalProvider" [(ngModel)]="row.externalProvider" class="w-full" />
          <label for="externalProvider">{{ 'labels.external-provider' | transloco }}</label>
        </p-floatlabel>
      </div>
    </ng-template>
  </genesis-data-table>
</div>
