<div class="relative flex flex-col flex-auto items-center px-6 sm:px-12">
  <div class="w-full max-w-3xl">
    <div class="mt-3 mb-3">
      <p-fileupload
        #fileUpload
        name="file"
        [url]="uploadUrl"
        [auto]="true"
        accept=".jpg,.jpeg,.png,.svg"
        [multiple]="false"
        [maxFileSize]="10000000"
        (onBeforeSend)="onBeforeSend($event)"
        (onUpload)="onUploaded($event)">
        <ng-template pTemplate="empty">
          <div class="flex flex-col items-center py-4">
            <span>{{ 'descriptions.drop-here' | transloco }}</span>
            <span>{{ 'descriptions.click-to-upload' | transloco }}</span>
          </div>
        </ng-template>
      </p-fileupload>
    </div>

    <div class="w-full">
      <genesis-data-table
        #grid
        title="Logos"
        [lazy]="false"
        [loadPath]="loadPath"
        [pageSize]="20"
        [columns]="columns">

        <ng-template gdtCell="path" let-row>
          <img [src]="row.path" class="border" height="50" />
        </ng-template>
      </genesis-data-table>
    </div>
  </div>
</div>
