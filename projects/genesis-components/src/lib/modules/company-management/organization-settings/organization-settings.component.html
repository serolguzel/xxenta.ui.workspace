<div class="flex flex-auto">
    <div class="mx-auto flex w-full max-w-xs flex-auto flex-col sm:max-w-5xl">
        <nav class="flex min-w-[240px] flex-col gap-1">
            <ul class="divide-y divide-gray-200 dark:divide-gray-700">
                @for (item of settings; track item.id) {
                    <organization-settings-excel-import [data]="item"
                        (onDeleteClick)="deleteItem(item)"></organization-settings-excel-import>
                }
            </ul>

            <div class="flex-auto">
                <form [formGroup]="form" class="mt-2">
                    <div class="grid">
                        <div class="col-12 md:col-6">
                            <p-floatlabel>
                                <input pInputText id="key" formControlName="key" class="w-full" />
                                <label for="key">{{ 'labels.key' | transloco }}</label>
                            </p-floatlabel>
                            @if (form.get('key')?.invalid && form.get('key')?.touched) {
                                <small class="p-error">{{ 'messages.required' | transloco }}</small>
                            }
                        </div>

                        <div class="col-12 md:col-6">
                            <p-floatlabel>
                                <input pInputText id="value" formControlName="value" class="w-full" />
                                <label for="value">{{ 'labels.value' | transloco }}</label>
                            </p-floatlabel>
                            @if (form.get('value')?.invalid && form.get('value')?.touched) {
                                <small class="p-error">{{ 'messages.required' | transloco }}</small>
                            }
                        </div>
                    </div>
                </form>

                <div class="flex justify-content-end mt-4">
                    <p-button [label]="'labels.save' | transloco" icon="pi pi-save" (onClick)="onSave()" />
                </div>
            </div>
        </nav>
    </div>
</div>
