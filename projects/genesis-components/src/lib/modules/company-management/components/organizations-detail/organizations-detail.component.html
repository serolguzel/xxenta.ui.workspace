<div class="p-4 bg-white">
  <genesis-data-table
    [lazy]="true"
    loadPath="Organization/GetOrganizations"
    [extraParams]="extraParams"
    [columns]="columns"
    [pageSize]="20">

    <ng-template gdtCell="name" let-row>
      <a [routerLink]="row.isTenant ? '/tenant/tenants/detail/' + row.id : '/tenant/companies/detail/' + row.id"
        class="font-bold">{{ row.name }}</a>
    </ng-template>

    <ng-template gdtCell="officialName" let-row>
      <a [routerLink]="row.isTenant ? '/tenant/tenants/detail/' + row.id : '/tenant/companies/detail/' + row.id"
        class="font-bold">{{ row.officialName }}</a>
    </ng-template>

    <ng-template gdtCell="organizationTypes" let-row>
      <div class="flex flex-wrap gap-1">
        @for (type of row.organizationTypes; track type) {
          <p-tag [value]="type" severity="info" />
        }
      </div>
    </ng-template>

    <ng-template gdtCell="$expansion" let-row>
      <organizations-detail [isTenant]="isTenant" [parentId]="row.id" />
    </ng-template>
  </genesis-data-table>
</div>
