<div class="p-6">
  <genesis-data-table
    [title]="'labels.permissions' | transloco"
    [lazy]="false"
    [editable]="true"
    [loadPath]="loadPath"
    [extraParams]="extraParams"
    insertPath="DataSharing"
    deletePath="DataSharing"
    updateKey="id"
    [editorTitle]="'labels.permission' | transloco"
    [pageSize]="20"
    [columns]="columns"
    [newRowDefaults]="newRowDefaults">

    <ng-template gdtCell="stateTypes" let-row>
      {{ row.stateTypes?.join(', ') }}
    </ng-template>

    <ng-template gdtCell="$editor" let-row>
      <div class="flex flex-col gap-4 pt-2">
        <p-floatlabel>
          <p-select appendTo="body" inputId="partnerId" [(ngModel)]="row.partnerId" [options]="partners" optionLabel="name"
            optionValue="id" [filter]="true" class="w-full" />
          <label for="partnerId">{{ 'labels.partner' | transloco }}</label>
        </p-floatlabel>

        <p-floatlabel>
          <p-select appendTo="body" inputId="operatorId" [(ngModel)]="row.operatorId" [options]="operators" optionLabel="name"
            optionValue="id" [filter]="true" class="w-full" />
          <label for="operatorId">{{ 'labels.operator' | transloco }}</label>
        </p-floatlabel>

        <p-floatlabel>
          <p-multiselect appendTo="body" inputId="stateTypes" [(ngModel)]="row.stateTypes" [options]="stateTypes" optionLabel="name"
            optionValue="code" [filter]="true" class="w-full" />
          <label for="stateTypes">{{ 'labels.state-types' | transloco }}</label>
        </p-floatlabel>

        <div class="flex gap-4">
          <div class="flex align-items-center gap-2">
            <p-checkbox [(ngModel)]="row.read" [binary]="true" inputId="read" />
            <label for="read">{{ 'labels.read' | transloco }}</label>
          </div>
          <div class="flex align-items-center gap-2">
            <p-checkbox [(ngModel)]="row.write" [binary]="true" inputId="write" />
            <label for="write">{{ 'labels.write' | transloco }}</label>
          </div>
        </div>
      </div>
    </ng-template>
  </genesis-data-table>
</div>
