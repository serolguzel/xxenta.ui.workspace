<div class="p-6">
  <genesis-data-table
    [title]="options.pageTitle ?? ''"
    loadPath="Organization/GetOrganizations"
    [extraParams]="options.params ?? {}"
    [columns]="columns"
    [pageSize]="20"
    [showCreateButton]="true"
    (createClick)="createOrganization()">

    <ng-template gdtCell="name" let-org>
      <a [routerLink]="'detail/' + org.id" class="font-bold">{{ org.name }}</a>
    </ng-template>

    <ng-template gdtCell="officialName" let-org>
      <a [routerLink]="'detail/' + org.id" class="font-bold">{{ org.officialName }}</a>
    </ng-template>

    <ng-template gdtCell="organizationTypes" let-org>
      <div class="flex flex-wrap gap-1">
        @for (type of org.organizationTypes; track type) {
          <p-tag [value]="type" severity="info" />
        }
      </div>
    </ng-template>

    <ng-template gdtCell="$expansion" let-org>
      <organizations-detail [isTenant]="true" [parentId]="org.id" />
    </ng-template>
  </genesis-data-table>
</div>
