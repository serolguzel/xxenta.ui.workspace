<div class="p-6">
  <genesis-data-table
    title="Contacts"
    [lazy]="false"
    [editable]="true"
    [loadPath]="loadPath"
    [insertPath]="loadPath"
    updatePath="OrganizationContact"
    deletePath="OrganizationContact/Delete"
    updateKey="id"
    editorTitle="Contact"
    [pageSize]="20"
    [columns]="columns"
    [newRowDefaults]="{ confirm: false, isDefault: false }">

    <ng-template gdtCell="$editor" let-row>
      <div class="flex flex-col gap-4 pt-2">
        <p-floatlabel>
          <p-select appendTo="body" inputId="contactType" [(ngModel)]="row.contactType" [options]="contactTypes"
            optionLabel="name" optionValue="id" class="w-full" />
          <label for="contactType">Contact Type</label>
        </p-floatlabel>

        <p-floatlabel>
          <input pInputText id="text" [(ngModel)]="row.text" class="w-full" />
          <label for="text">Text</label>
        </p-floatlabel>

        <div class="flex gap-4">
          <div class="flex align-items-center gap-2">
            <p-checkbox [(ngModel)]="row.confirm" [binary]="true" inputId="confirm" />
            <label for="confirm">Confirm</label>
          </div>
          <div class="flex align-items-center gap-2">
            <p-checkbox [(ngModel)]="row.isDefault" [binary]="true" inputId="isDefault" />
            <label for="isDefault">Is Default</label>
          </div>
        </div>
      </div>
    </ng-template>
  </genesis-data-table>
</div>
