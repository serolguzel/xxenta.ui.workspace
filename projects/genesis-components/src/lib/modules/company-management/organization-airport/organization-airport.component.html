<div class="p-6 w-full max-w-3xl">
  <genesis-data-table
    [title]="'labels.airports' | transloco"
    [lazy]="false"
    [editable]="true"
    [loadPath]="basePath"
    [insertPath]="basePath"
    [deletePath]="basePath"
    updateKey="airportCode"
    [editorTitle]="'labels.airport' | transloco"
    [pageSize]="20"
    [columns]="columns">

    <ng-template gdtCell="$editor" let-row>
      <div class="flex flex-col gap-4 pt-2">
        <p-floatlabel>
          <p-select appendTo="body" inputId="airportCode" [(ngModel)]="row.airportCode" [options]="airports" optionLabel="name"
            optionValue="id" [filter]="true" class="w-full" />
          <label for="airportCode">{{ 'labels.airport' | transloco }}</label>
        </p-floatlabel>
      </div>
    </ng-template>
  </genesis-data-table>
</div>
