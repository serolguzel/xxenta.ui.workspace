<div class="p-6">
  <genesis-data-table
    #table
    [title]="'labels.customer-applications' | transloco"
    [lazy]="false"
    [editable]="true"
    [loadPath]="loadPath"
    [deletePath]="deletePath"
    updateKey="appId"
    [showCreateButton]="true"
    [pageSize]="20"
    [columns]="columns"
    (createClick)="saveApp()">

    <ng-template gdtCell="app.name" let-row>
      <a [routerLink]="'add-app/' + row.appId">
        <span class="flex font-bold">{{ row.app?.name }}</span>
      </a>
    </ng-template>

    <ng-template gdtCell="price" let-row>
      <span class="flex font-bold">{{ row.price }} {{ row.currency }}</span>
    </ng-template>

    <ng-template gdtCell="$actions" let-row>
      <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger"
        (onClick)="table.deleteRow(row)" />
    </ng-template>
  </genesis-data-table>
</div>
