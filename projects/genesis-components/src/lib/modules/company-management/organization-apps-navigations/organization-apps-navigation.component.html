<div class="p-6">
  <genesis-data-table
    [title]="'labels.application-navigations' | transloco"
    [lazy]="false"
    [editable]="true"
    [loadPath]="loadPath"
    [extraParams]="extraParams"
    [insertPath]="basePath"
    [updatePath]="basePath"
    [deletePath]="basePath"
    updateKey="id"
    [editorTitle]="'labels.navigation' | transloco"
    [pageSize]="20"
    [columns]="columns"
    [newRowDefaults]="newRowDefaults">

    <ng-template gdtCell="navigation.title" let-row>
      <span class="flex font-bold justify-start items-center">
        <mat-icon [svgIcon]="row.navigation?.icon"></mat-icon>
        <div class="ml-2">{{ row.navigation?.title }}</div>
      </span>
    </ng-template>

    <ng-template gdtCell="$editor" let-row>
      <div class="flex flex-col gap-4 pt-2">
        <p-floatlabel>
          <p-select appendTo="body" inputId="navigationId" [(ngModel)]="row.navigationId" [options]="navigations" optionLabel="name"
            optionValue="id" [filter]="true" class="w-full" />
          <label for="navigationId">{{ 'labels.navigation' | transloco }}</label>
        </p-floatlabel>

        <div class="flex align-items-center gap-2">
          <p-checkbox [(ngModel)]="row.active" [binary]="true" inputId="active" />
          <label for="active">{{ 'labels.active' | transloco }}</label>
        </div>
      </div>
    </ng-template>
  </genesis-data-table>
</div>
