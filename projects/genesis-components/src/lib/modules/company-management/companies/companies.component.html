<div class="p-6">
  <genesis-data-table
    [title]="pageTitle"
    loadPath="Organization"
    [extraParams]="{ isTenant: true }"
    [columns]="columns"
    [pageSize]="20"
    [showCreateButton]="true"
    (createClick)="createAgency()">

    <ng-template gdtCell="name" let-company>
      <a [routerLink]="['detail', company.id]" class="flex flex-col">
        <span class="font-bold">{{ company.name }}</span>
        <span class="text-sm">{{ company.code }}</span>
      </a>
    </ng-template>

    <ng-template gdtCell="officialName" let-company>
      <a [routerLink]="['detail', company.id]" class="flex flex-col">
        <span class="font-bold">{{ company.officialName }}</span>
        <span class="text-sm">{{ company.code }}</span>
      </a>
    </ng-template>

    <ng-template gdtCell="organizationTypes" let-company>
      <div class="flex flex-wrap gap-1">
        @for (type of company.organizationTypes; track type) {
          <p-tag [value]="type" severity="info" />
        }
      </div>
    </ng-template>

    <ng-template gdtCell="$actions" let-company>
      <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" (onClick)="editAgency(company)" />
    </ng-template>
  </genesis-data-table>
</div>
