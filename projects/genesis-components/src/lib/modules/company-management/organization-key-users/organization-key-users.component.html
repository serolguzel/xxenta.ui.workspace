<div class="p-6">
  <genesis-data-table
    [title]="pageTitle"
    [lazy]="false"
    [editable]="true"
    [loadPath]="basePath"
    [insertPath]="basePath"
    [deletePath]="basePath"
    updateKey="id"
    [editorTitle]="'labels.key-user' | transloco"
    [pageSize]="20"
    [columns]="columns"
    [newRowDefaults]="{ isDefault: false }">

    <ng-template gdtCell="$editor" let-row>
      <div class="flex flex-col gap-4 pt-2">
        <p-floatlabel>
          <p-select appendTo="body" inputId="userId" [(ngModel)]="row.userId" [options]="users" optionLabel="displayName"
            optionValue="id" [filter]="true" class="w-full" />
          <label for="userId">{{ 'labels.user' | transloco }}</label>
        </p-floatlabel>

        <div class="flex align-items-center gap-2">
          <p-checkbox [(ngModel)]="row.isDefault" [binary]="true" inputId="isDefault" />
          <label for="isDefault">{{ 'labels.is-default' | transloco }}</label>
        </div>
      </div>
    </ng-template>
  </genesis-data-table>
</div>
