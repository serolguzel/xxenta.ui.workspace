<div class="p-6">
  <genesis-data-table
    [title]="'labels.partners' | transloco"
    [lazy]="false"
    [editable]="true"
    [loadPath]="loadPath"
    [insertPath]="insertPath"
    deletePath="OrganizationPartner"
    updateKey="id"
    [editorTitle]="'labels.partner' | transloco"
    [pageSize]="20"
    [columns]="columns"
    [newRowDefaults]="newRowDefaults">

    <ng-template gdtCell="fromOrganization.name" let-row>
      <a [routerLink]="[row.toOrganizationId]">
        <span class="flex font-bold">{{ row.fromOrganization?.name }}</span>
        <span class="flex text-sm">{{ row.fromOrganization?.code }}</span>
      </a>
    </ng-template>

    <ng-template gdtCell="$editor" let-row>
      <div class="flex flex-col gap-4 pt-2">
        <p-floatlabel>
          <p-select appendTo="body" inputId="toOrganizationId" [(ngModel)]="row.toOrganizationId" [options]="partnerOptions"
            optionLabel="name" optionValue="id" [filter]="true" filterBy="name" class="w-full" />
          <label for="toOrganizationId">{{ 'labels.partner' | transloco }}</label>
        </p-floatlabel>

        <div class="flex gap-4">
          <div class="flex align-items-center gap-2">
            <p-checkbox [(ngModel)]="row.fromConfirm" [binary]="true" inputId="fromConfirm" />
            <label for="fromConfirm">{{ 'labels.from-confirm' | transloco }}</label>
          </div>
          <div class="flex align-items-center gap-2">
            <p-checkbox [(ngModel)]="row.toConfirm" [binary]="true" inputId="toConfirm" />
            <label for="toConfirm">{{ 'labels.to-confirm' | transloco }}</label>
          </div>
        </div>
      </div>
    </ng-template>
  </genesis-data-table>
</div>
