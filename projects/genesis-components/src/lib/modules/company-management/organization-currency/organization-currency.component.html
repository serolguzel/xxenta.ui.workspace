<div class="p-6 w-full max-w-3xl">
  <genesis-data-table
    [title]="'labels.currencies' | transloco"
    [lazy]="false"
    [editable]="true"
    [loadPath]="basePath"
    [insertPath]="basePath"
    [deletePath]="basePath"
    updateKey="currencyCode"
    [editorTitle]="'labels.currency' | transloco"
    [pageSize]="20"
    [columns]="columns"
    [newRowDefaults]="{ isDefault: false }">

    <ng-template gdtCell="$editor" let-row>
      <div class="flex flex-col gap-4 pt-2">
        <p-floatlabel>
          <p-select appendTo="body" inputId="currencyCode" [(ngModel)]="row.currencyCode" [options]="currencies" optionLabel="name"
            optionValue="code" [filter]="true" class="w-full" />
          <label for="currencyCode">{{ 'labels.currency' | transloco }}</label>
        </p-floatlabel>

        <div class="flex align-items-center gap-2">
          <p-checkbox [(ngModel)]="row.isDefault" [binary]="true" inputId="isDefault" />
          <label for="isDefault">{{ 'labels.is-default' | transloco }}</label>
        </div>
      </div>
    </ng-template>
  </genesis-data-table>
</div>
