<div class="p-6">
  <genesis-data-table
    [title]="'labels.contact-people' | transloco"
    [lazy]="false"
    [editable]="true"
    [loadPath]="loadPath"
    [insertPath]="loadPath"
    updatePath="CompanyContactPerson"
    deletePath="CompanyContactPerson"
    updateKey="id"
    [editorTitle]="'labels.contact-person' | transloco"
    [pageSize]="20"
    [columns]="columns"
    [newRowDefaults]="{ confirmEmail: false, confirmPhone: false, isDefault: false }">

    <ng-template gdtCell="$editor" let-row>
      <div class="flex flex-col gap-4 pt-2">
        <p-floatlabel>
          <p-select appendTo="body" inputId="contactType" [(ngModel)]="row.contactType" [options]="contactTypes"
            optionLabel="name" optionValue="id" class="w-full" />
          <label for="contactType">{{ 'labels.contact-type' | transloco }}</label>
        </p-floatlabel>

        <div class="flex gap-4">
          <p-floatlabel class="flex-1">
            <input pInputText id="firstName" [(ngModel)]="row.firstName" class="w-full" />
            <label for="firstName">{{ 'labels.first-name' | transloco }}</label>
          </p-floatlabel>
          <p-floatlabel class="flex-1">
            <input pInputText id="lastName" [(ngModel)]="row.lastName" class="w-full" />
            <label for="lastName">{{ 'labels.last-name' | transloco }}</label>
          </p-floatlabel>
        </div>

        <p-floatlabel>
          <input pInputText id="email" [(ngModel)]="row.email" class="w-full" />
          <label for="email">{{ 'labels.email' | transloco }}</label>
        </p-floatlabel>

        <p-floatlabel>
          <input pInputText id="phone" [(ngModel)]="row.phone" class="w-full" />
          <label for="phone">{{ 'labels.phone' | transloco }}</label>
        </p-floatlabel>

        <div class="flex gap-4">
          <div class="flex align-items-center gap-2">
            <p-checkbox [(ngModel)]="row.confirmEmail" [binary]="true" inputId="confirmEmail" />
            <label for="confirmEmail">{{ 'labels.confirm-email' | transloco }}</label>
          </div>
          <div class="flex align-items-center gap-2">
            <p-checkbox [(ngModel)]="row.confirmPhone" [binary]="true" inputId="confirmPhone" />
            <label for="confirmPhone">{{ 'labels.confirm-phone' | transloco }}</label>
          </div>
          <div class="flex align-items-center gap-2">
            <p-checkbox [(ngModel)]="row.isDefault" [binary]="true" inputId="isDefault" />
            <label for="isDefault">{{ 'labels.is-default' | transloco }}</label>
          </div>
        </div>
      </div>
    </ng-template>
  </genesis-data-table>
</div>
