<div class="p-6">
  <genesis-data-table
    [title]="'labels.customers' | transloco"
    [lazy]="false"
    [loadPath]="loadPath"
    [showCreateButton]="true"
    [pageSize]="20"
    [columns]="columns"
    (createClick)="createOrganization()">

    <ng-template gdtCell="name" let-row>
      <a [routerLink]="options.detailRoute + '/' + row.id">
        <span class="flex font-bold">{{ row.name }}</span>
        <span class="flex text-sm">{{ row.oprVoucher }}</span>
      </a>
    </ng-template>

    <ng-template gdtCell="officialName" let-row>
      <a [routerLink]="options.detailRoute + '/' + row.id">
        <span class="flex font-bold">{{ row.officialName }}</span>
        <span class="flex text-sm">{{ row.oprVoucher }}</span>
      </a>
    </ng-template>
  </genesis-data-table>
</div>
