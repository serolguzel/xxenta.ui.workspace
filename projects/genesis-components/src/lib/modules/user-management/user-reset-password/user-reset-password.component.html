<div id="password-container" class="w-full max-w-2xl">
    <dx-form id="form" [(formData)]="model" labelMode="floating">
        <dxi-item dataField="newPassword">
            <dx-text-box [(value)]="model.newPassword" 
                placeholder="Password" mode="password"
                [(mode)]="passwordMode">
                <dxi-button name="today" location="after" [options]="{
                    icon: passwordButtonIcon,
                    stylingMode: 'text',
                    onClick: passwordOnClick
                }"></dxi-button>
            </dx-text-box>
            <dxo-label text="Password"> </dxo-label>
            <dxi-validation-rule type="required" message="Required"></dxi-validation-rule>
        </dxi-item>
        <dxi-item dataField="confirmPassword">
            <dx-text-box [(value)]="model.confirmPassword" placeholder="Confirm Password" mode="password" [(mode)]="rePasswordMode">
                <dxi-button name="today" location="after" [options]="{
                    icon: rePasswordButtonIcon,
                    stylingMode: 'text',
                    onClick: rePasswordOnClick
                }"></dxi-button>
            </dx-text-box>
            <dxo-label text="Confirm Password"> </dxo-label>  
            <dxi-validation-rule type="required" message="Required"></dxi-validation-rule>
            <dxi-validation-rule type="compare" [comparisonTarget]="passwordComparison"  [message]="'validation.password-mismatch' | transloco"></dxi-validation-rule>
        </dxi-item>
    </dx-form>
    <dx-toolbar class="mt-2">
        <dxi-item location="after" widget="dxButton" [options]="btnSave"></dxi-item>
        <dxi-item location="before" widget="dxButton" [options]="btnCancel"></dxi-item>
    </dx-toolbar>

    <ul class="ml-2 mt-4 list-disc">
        <li [ngClass]="{'text-green-500' : newPassword, 'text-red-500' : !newPassword }">
            Şifreniz en az 8 karakter olmalı.
        </li>
        <li [ngClass]="{'text-green-500' : upperCase, 'text-red-500' : !upperCase}">
            En az 1 büyük harf içermeli.
        </li>
        <li [ngClass]="{'text-green-500' : lowerCase, 'text-red-500' : !lowerCase}">
            En az 1 küçük harf içermeli.
        </li>
        <li [ngClass]="{'text-green-500' : isNumber, 'text-red-500' : !isNumber}">
            En az 1 rakam içermeli.
        </li>
        <li [ngClass]="{'text-green-500' : isSpecialChar, 'text-red-500' : !isSpecialChar}">
            En az 1 özel karakter içermeli. ({{ specialChars }})
        </li>
    
    </ul>
</div>

<dx-load-panel #loadPanel shadingColor="rgba(0,0,0,0.4)" 
  [position]="{ of: '#password-container' }"
  [(visible)]="loadingVisible"
  [showIndicator]="true" 
  [showPane]="true"
  [shading]="true" 
  [hideOnOutsideClick]="false">
</dx-load-panel>
