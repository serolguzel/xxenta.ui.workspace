<div [ngClass]="options.paddingCss">
  <genesis-data-table
    [title]="options.pageTitle ?? ''"
    [loadPath]="options.loadPath!"
    [extraParams]="extraParams"
    [columns]="columns"
    [pageSize]="10"
    [showCreateButton]="!!options.createRoute"
    (createClick)="createUser()">

    <ng-template gdtCell="id" let-user>
      <a [routerLink]="detailRoute(user.id)">
        <div class="flex flex-0 items-center justify-center w-8 h-8 rounded-full overflow-hidden">
          @if (user.picture) {
            <img class="object-cover w-full h-full" [src]="user.picture" alt="" />
          } @else {
            <div class="flex items-center justify-center w-full h-full rounded-full text-sm uppercase bg-gray-200 text-gray-600 dark:bg-gray-700 dark:text-gray-200">
              @if (user.firstName || user.lastName) {
                {{ user.firstName?.charAt(0) }}{{ user.lastName?.charAt(0) }}
              } @else {
                N/A
              }
            </div>
          }
        </div>
      </a>
    </ng-template>

    <ng-template gdtCell="firstName" let-user>
      <a [routerLink]="detailRoute(user.id)" class="font-bold">{{ user.firstName }}</a>
    </ng-template>
    <ng-template gdtCell="lastName" let-user>
      <a [routerLink]="detailRoute(user.id)" class="font-bold">{{ user.lastName }}</a>
    </ng-template>
    <ng-template gdtCell="userName" let-user>
      <a [routerLink]="detailRoute(user.id)" class="font-bold">{{ user.userName }}</a>
    </ng-template>
    <ng-template gdtCell="email" let-user>
      <a [routerLink]="detailRoute(user.id)" class="font-bold">{{ user.email }}</a>
    </ng-template>
    <ng-template gdtCell="gender" let-user>
      <a [routerLink]="detailRoute(user.id)" class="font-bold">{{ user.gender }}</a>
    </ng-template>
  </genesis-data-table>
</div>
