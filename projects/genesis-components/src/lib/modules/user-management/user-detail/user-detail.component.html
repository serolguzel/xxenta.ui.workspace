<div class="w-full max-w-3xl" [ngClass]="options.paddingCss">
    <user-form 
    [model]="user" 
    [disableSaveButton]="hasUpdate"
    [disableDeleteButton]="disableDeleteButton"
    [visibleCustomerLookup]="options.permissions?.visibleCustomerLookup!"
    [visibleUserType]="options.permissions?.visibleUserType!"
    (onSaveClick)="onSaveClick($event)"
    (onCancelClick)="onCancelClick($event)"
    (onDeleteClick)="onDeleteClick($event)"></user-form>
</div>
