<div class="p-6 grow">
  <genesis-data-table
    #grid
    loadPath="Logging"
    [extraParams]="filter"
    [columns]="columns"
    [pageSize]="20"
    [showSearch]="false"
    [columnChooser]="true">

    <ng-template gdtCell="$toolbarStart">
      <p-datepicker [(ngModel)]="createDateValue" (ngModelChange)="onDateChange()" dateFormat="dd.mm.yy"
        [showClear]="true" appendTo="body" [placeholder]="'labels.create-date' | transloco" />
      <input pInputText type="text" [(ngModel)]="filter.message" (ngModelChange)="onFilterChange()"
        [placeholder]="('labels.message' | transloco) + ':'" class="w-48" />
      <input pInputText type="text" [(ngModel)]="filter.source" (ngModelChange)="onFilterChange()"
        [placeholder]="('labels.source' | transloco) + ':'" class="w-48" />
      <input pInputText type="text" [(ngModel)]="filter.voucher" (ngModelChange)="onFilterChange()"
        [placeholder]="('labels.voucher' | transloco) + ':'" class="w-48" />
      <input pInputText type="text" [(ngModel)]="filter.host" (ngModelChange)="onFilterChange()"
        [placeholder]="('labels.host' | transloco) + ':'" class="w-48" />
      <input pInputText type="text" [(ngModel)]="filter.correlationId" (ngModelChange)="onFilterChange()"
        [placeholder]="('labels.correlation-id' | transloco) + ':'" class="w-48" />
      <p-select [(ngModel)]="filter.loggingType" (onChange)="onFilterChange()" [options]="loggingTypes"
        optionLabel="text" optionValue="id" [showClear]="true" appendTo="body"
        [placeholder]="('labels.logging-type' | transloco) + ':'" class="w-48" />
    </ng-template>

    <ng-template gdtCell="$toolbarEnd">
      <p-button icon="pi pi-refresh" [pTooltip]="'labels.refresh' | transloco" (onClick)="onRefresh()" />
    </ng-template>

    <ng-template gdtCell="message" let-row>
      <div class="flex justify-start items-center">
        <a [routerLink]="row.id" [queryParams]="filter"><span class="font-bold">{{ row.message }}</span></a>
        @if (row.message) {
          <button [cdkCopyToClipboard]="row.message" class="ml-2 hover:bg-blue-50 p-[3px] rounded-full"
            (click)="onCopy(row.message)" [pTooltip]="'labels.copy' | transloco" tooltipPosition="top">
            <mat-icon [svgIcon]="compyValue === row.message ? 'heroicons_outline:clipboard-document-check' : 'heroicons_outline:clipboard'"
              [ngClass]="compyValue === row.message ? 'icon-size-5 text-green-700' : 'icon-size-5'"></mat-icon>
          </button>
        }
      </div>
    </ng-template>

    <ng-template gdtCell="voucher" let-row>
      <div class="flex justify-start items-center">
        <a [routerLink]="row.id" [queryParams]="filter"><span class="font-bold">{{ row.voucher }}</span></a>
        @if (row.voucher) {
          <button [cdkCopyToClipboard]="row.voucher" class="ml-2 hover:bg-blue-50 p-[3px] rounded-full"
            (click)="onCopy(row.voucher)" [pTooltip]="'labels.copy' | transloco" tooltipPosition="top">
            <mat-icon [svgIcon]="compyValue === row.voucher ? 'heroicons_outline:clipboard-document-check' : 'heroicons_outline:clipboard'"
              [ngClass]="compyValue === row.voucher ? 'icon-size-5 text-green-700' : 'icon-size-5'"></mat-icon>
          </button>
        }
      </div>
    </ng-template>

    <ng-template gdtCell="source" let-row>
      <a [routerLink]="row.id"><span class="font-bold">{{ row.source }}</span></a>
    </ng-template>

    <ng-template gdtCell="correlationId" let-row>
      <div class="flex justify-start items-center">
        <span class="font-bold">{{ row.correlationId }}</span>
        @if (row.correlationId) {
          <button [cdkCopyToClipboard]="row.correlationId" class="ml-2 hover:bg-blue-50 p-[3px] rounded-full"
            (click)="onCopy(row.correlationId)" [pTooltip]="'labels.copy' | transloco" tooltipPosition="top">
            <mat-icon [svgIcon]="compyValue === row.correlationId ? 'heroicons_outline:clipboard-document-check' : 'heroicons_outline:clipboard'"
              [ngClass]="compyValue === row.correlationId ? 'icon-size-5 text-green-700' : 'icon-size-5'"></mat-icon>
          </button>
        }
      </div>
    </ng-template>
  </genesis-data-table>
</div>
