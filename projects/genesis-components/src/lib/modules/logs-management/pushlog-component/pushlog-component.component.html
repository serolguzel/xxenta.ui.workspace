<div class="p-6 grow">
  <genesis-data-table
    #grid
    loadPath="Push"
    [extraParams]="filter"
    [columns]="columns"
    [pageSize]="20"
    [columnChooser]="true">

    <ng-template gdtCell="$toolbarStart">
      <input pInputText type="text" [(ngModel)]="filter.code" (ngModelChange)="onFilterChange()"
        [placeholder]="('labels.code' | transloco) + ':'" class="w-52" />
      <input pInputText type="text" [(ngModel)]="filter.filterText" (ngModelChange)="onFilterChange()"
        [placeholder]="('labels.search' | transloco) + ':'" class="w-52" />
    </ng-template>

    <ng-template gdtCell="code" let-row>
      <a [routerLink]="row.id" class="font-bold">{{ row.code }}</a>
    </ng-template>
    <ng-template gdtCell="description" let-row>
      <a [routerLink]="row.id" class="font-bold">{{ row.description }}</a>
    </ng-template>
  </genesis-data-table>
</div>
