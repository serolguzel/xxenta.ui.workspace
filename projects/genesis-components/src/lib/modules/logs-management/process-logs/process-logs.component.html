<div class="p-6 grow">
  <genesis-data-table
    loadPath="Progress/GetSejourTransferProcess"
    [columns]="columns"
    [pageSize]="20"
    [columnChooser]="true">

    <ng-template gdtCell="externalId" let-row>
      <a [routerLink]="row.id" class="font-bold">{{ row.externalId }}</a>
    </ng-template>
    <ng-template gdtCell="voucher" let-row>
      <a [routerLink]="row.id" class="font-bold">{{ row.voucher }}</a>
    </ng-template>
    <ng-template gdtCell="message" let-row>
      <a [routerLink]="row.id" class="font-bold">{{ row.message }}</a>
    </ng-template>
  </genesis-data-table>
</div>
