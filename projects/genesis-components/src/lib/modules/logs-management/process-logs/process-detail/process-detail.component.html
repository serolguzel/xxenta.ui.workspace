<div class="w-full flex flex-col">
  <!-- Header -->
  <div
    class="flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between p-6 sm:py-8 sm:px-10 border-b bg-card dark:bg-transparent">
    <div class="flex-1 min-w-0">
      <genesis-breadcrumbs [Breadcrumbs]="breadcrumbs" class="flex"></genesis-breadcrumbs>
    </div>
  </div>

  <div class="mx-auto flex w-full max-w-5xl flex-auto justify-center px-6 sm:px-8">
    <div class="flex flex-auto p-6 sm:p-10">
      <div class="mt-6 border-t border-gray-100">
        <dl class="divide-y divide-gray-100">
          <div class="px-4 py-6 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-0">
            <dt class="text-base font-medium text-gray-900">{{ 'labels.code' | transloco }}</dt>
            <dd class="mt-1 text-base text-gray-700 sm:col-span-2 sm:mt-0">{{data.externalId}}</dd>
          </div>
          <div class="px-4 py-6 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-0">
            <dt class="text-base font-medium text-gray-900">{{ 'labels.voucher' | transloco }}</dt>
            <dd class="mt-1 text-base text-gray-700 sm:col-span-2 sm:mt-0">{{data.voucher}}</dd>
          </div>
          <div class="px-4 py-6 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-0">
            <dt class="text-base font-medium text-gray-900">{{ 'labels.message' | transloco }}</dt>
            <dd class="mt-1 text-base text-gray-700 sm:col-span-2 sm:mt-0">{{data.message}}</dd>
          </div>

          <div class="px-4 py-6 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-0">
            <dt class="text-base font-medium text-gray-900">{{ 'labels.create-date' | transloco }}</dt>
            <dd class="mt-1 text-base text-gray-700 sm:col-span-2 sm:mt-0">
              {{data.createDate | date: 'dd.MM.yyyy HH:mm'}}
            </dd>
          </div>

          <div class="px-4 py-6 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-0">
            <dt class="text-base font-medium text-gray-900">{{ 'labels.data' | transloco }}</dt>
            <dd class="mt-1 text-base text-gray-700 sm:col-span-2 sm:mt-0">
              <pre class="json-container" [innerHTML]="prettyPrintJson.toHtml(data.data)"></pre>
            </dd>
          </div>
        </dl>
      </div>
    </div>
  </div>
</div>
