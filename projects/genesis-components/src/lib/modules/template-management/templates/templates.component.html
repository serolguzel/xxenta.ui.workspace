<div class="p-6">
  <genesis-data-table
    [title]="options.pageTitle ?? ''"
    loadPath="Template"
    [columns]="columns"
    [pageSize]="20"
    [showCreateButton]="true"
    (createClick)="createTemplate()">

    <ng-template gdtCell="code" let-row>
      <a [routerLink]="'detail/' + row.id" class="font-bold">{{ row.code }}</a>
    </ng-template>

    <ng-template gdtCell="title" let-row>
      <a [routerLink]="'detail/' + row.id" class="font-bold">{{ row.title }}</a>
    </ng-template>

    <ng-template gdtCell="templateStatus" let-row>
      <div class="flex flex-wrap gap-1">
        @for (status of row.templateStatus; track status) {
          <p-tag [value]="status" severity="info" />
        }
      </div>
    </ng-template>
  </genesis-data-table>
</div>
