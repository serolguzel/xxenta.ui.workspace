<div class="p-6">
    <dx-data-grid id="gridContainer" 
            [dataSource]="dataSource"
            [remoteOperations]="true"
            [showColumnLines]="false"
            [showBorders]="true"
            [showRowLines]="true"
            [rowAlternationEnabled]="true"
            [hoverStateEnabled]="true"
            [allowColumnResizing]="true"
            [columnHidingEnabled]="false">
          
              <dxo-search-panel [visible]="true"></dxo-search-panel>
              <dxo-filter-row [visible]="true"></dxo-filter-row>
              <dxo-group-panel [visible]="false"></dxo-group-panel>

            <dxo-toolbar>
                <dxi-item location="before">
                    <div *dxTemplate>
                        <div class="text-2xl tracking-tight">
                            {{options.pageTitle}}
                        </div>
                    </div>
                </dxi-item>
            <dxi-item locateInMenu="auto" location="after">
                <div *dxTemplate>
                    <dx-button icon="add" (onClick)="createTemplate($event)"></dx-button>
                </div>
            </dxi-item>
                <dxi-item name="columnChooserButton" locateInMenu="auto"></dxi-item>
                <dxi-item name="searchPanel" locateInMenu="auto"></dxi-item>
            </dxo-toolbar>
            
            <dxi-column dataField="code" dataType="string" cellTemplate="nameTemp"></dxi-column>
            <dxi-column dataField="title" dataType="string" cellTemplate="nameTemp"></dxi-column>
            <dxi-column dataField="language" dataType="string"></dxi-column>
            <dxi-column dataField="templateStatus" dataType="array" [allowFiltering]="false"></dxi-column>
            <dxi-column dataField="itemType" dataType="string"></dxi-column>

            <div class="flex-auto" *dxTemplate="let d of 'nameTemp'">
                <a [routerLink]="'detail/'+d.data.id">
                    <span class="flex font-bold">
                        {{d.value}}
                    </span>
                </a>
            </div>
              <dxo-paging [pageSize]="20"></dxo-paging>
              <dxo-pager 
                [showPageSizeSelector]="true" 
                [showInfo]="true" 
                [allowedPageSizes]="[10, 20, 30]"></dxo-pager>
          </dx-data-grid>
    </div>
