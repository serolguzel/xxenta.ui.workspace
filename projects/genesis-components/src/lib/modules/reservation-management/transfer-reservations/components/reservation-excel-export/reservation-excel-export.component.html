<p-dialog [(visible)]="visible" [modal]="true" [draggable]="true" [resizable]="true"
  [header]="'labels.excel-export' | transloco" [style]="{ width: '460px' }"
  (onHide)="onHidden()">
  <form [formGroup]="form" class="mt-2">
    <div class="grid">
      <div class="col-12">
        <p-floatlabel>
          <p-datepicker inputId="transferDate" formControlName="transferDate" dateFormat="dd.mm.yy"
            [showClear]="true" appendTo="body" class="w-full" />
          <label for="transferDate">{{ 'labels.transfer-date' | transloco }}</label>
        </p-floatlabel>
        @if (form.get('transferDate')?.invalid && form.get('transferDate')?.touched) {
          <small class="p-error">{{ 'messages.required' | transloco }}</small>
        }
      </div>

      <div class="col-12">
        <p-floatlabel>
          <p-select inputId="operatorId" formControlName="operatorId"
            [options]="operatorDataSource" optionLabel="name" optionValue="id"
            [filter]="true" filterBy="name" [showClear]="true" appendTo="body" class="w-full" />
          <label for="operatorId">{{ 'labels.operator' | transloco }}</label>
        </p-floatlabel>
      </div>

      <div class="col-12">
        <p-floatlabel>
          <p-select inputId="routeType" formControlName="routeType"
            [options]="routeTypeDataSource" optionLabel="name" optionValue="code"
            [showClear]="true" appendTo="body" class="w-full" />
          <label for="routeType">{{ 'labels.route-type' | transloco }}</label>
        </p-floatlabel>
      </div>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button label="{{ 'labels.cancel' | transloco }}" icon="pi pi-times" severity="secondary"
      (onClick)="onHidden()" />
    <p-button label="{{ 'labels.export' | transloco }}" icon="pi pi-file-excel" (onClick)="save()" />
  </ng-template>
</p-dialog>
