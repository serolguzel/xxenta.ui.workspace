<div class="p-6">
  <genesis-data-table
    loadPath="FlightBooking"
    [extraParams]="extraParams"
    [columns]="columns"
    [pageSize]="20"
    [pageSizeOptions]="[10, 20, 30]"
    [columnChooser]="true"
    dataKey="id">

    <ng-template gdtCell="$toolbarStart">
      <p-select
        [options]="companyOptions"
        optionLabel="name"
        optionValue="id"
        [(ngModel)]="selectedOperatorId"
        (onChange)="onOperatorChange()"
        [filter]="true"
        [showClear]="true"
        appendTo="body"
        styleClass="w-60"
        [placeholder]="'labels.operator' | transloco" />

      <p-button icon="pi pi-search" [label]="'labels.search' | transloco" (onClick)="search()" />
    </ng-template>

    <ng-template gdtCell="$toolbarEnd">
      <p-button icon="pi pi-plus" (onClick)="createItem()" />
    </ng-template>

    <ng-template gdtCell="voucher" let-row>
      <a [routerLink]="options.editFlightReservation(row.id)" class="font-bold">{{ row.voucher }}</a>
    </ng-template>

    <ng-template gdtCell="oprVoucher" let-row>
      <a [routerLink]="options.editFlightReservation(row.id)" class="font-bold">{{ row.oprVoucher }}</a>
    </ng-template>

    <ng-template gdtCell="pnrNumber" let-row>
      <a [routerLink]="options.editFlightReservation(row.id)" class="font-bold">{{ row.pnrNumber }}</a>
    </ng-template>

    <ng-template gdtCell="fromAirport" let-row>
      <div class="flex items-center">
        <img
          src="assets/icons/flight-take-off_32.png"
          alt=""
          class="h-8 w-8 rounded-full border p-[4px]" />
        <div class="ml-3 flex flex-col">
          <span class="flex font-bold">{{ row.fromAirport }}</span>
          <span class="flex text-secondary mt-1 text-xs leading-none">{{ row.from?.name }}</span>
        </div>
      </div>
    </ng-template>

    <ng-template gdtCell="toAirport" let-row>
      <div class="flex items-center">
        <img
          src="assets/icons/landing-flight_32.png"
          alt=""
          class="h-8 w-8 rounded-full border p-[4px]" />
        <div class="ml-3 flex flex-col">
          <span class="flex font-bold">{{ row.toAirport }}</span>
          <span class="flex text-secondary mt-1 text-xs leading-none">{{ row.to?.name }}</span>
        </div>
      </div>
    </ng-template>

    <ng-template gdtCell="$expansion" let-row>
      <flight-guest-list-view [guests]="row.guests" />
    </ng-template>
  </genesis-data-table>
</div>
